# fly.toml app configuration for the crawl -> normalize -> dedup pipeline.
# Regenerated by `fly launch --config workers/fly.toml --no-deploy` (which
# strips comments and drops empty sections like a keyless [env] block) - no
# functional difference from the original, just less commentary. Re-added
# below.
#
# Unlike apps/api/fly.toml and apps/web/fly.toml, this app has no
# [http_service] - it's a one-shot batch job (workers/Dockerfile's CMD runs
# scripts/run_pipeline.py to completion and exits), not a standing server.
# See .github/workflows/crawl-pipeline.yml for how it's actually triggered
# on a schedule. DATABASE_URL is set via `fly secrets set`, not [env] here -
# it's a secret, not a plain env var.

app = 'german-smart-apply-workers'
primary_region = 'fra'

[build]
  # Relative to this file's own directory (workers/), NOT the repo root -
  # same "pass '.' explicitly as the build context" reasoning as
  # apps/api/fly.toml - the Dockerfile's own COPY paths are workers-root-
  # relative (see workers/Dockerfile), so no repo-root context is needed
  # here, but flyctl still wants an explicit context argument on deploy.
  dockerfile = 'Dockerfile'

[[vm]]
  # 512mb, deliberately chosen despite the history below - this is a one-shot
  # batch machine that runs for a few minutes every 4 hours, so the difference
  # in cost is small and so is the cost of a failed run.
  #
  # History worth knowing before changing this again: this was 512mb, was raised
  # to 1024mb after an OOM, and is now back at 512mb. The OOM came from
  # near_duplicates.py, which loads every visible job for the whole country -
  # full description text included - into memory in one fetchall(), then expands
  # each description into a set of 3-word shingles. That is O(all visible jobs)
  # by design (see the module docstring), so the footprint grows with the corpus:
  # ~12,900 visible jobs at the time of writing.
  #
  # This value is NOT backed by a peak-memory measurement. It could not be: the
  # pipeline had been dying on a dropped database connection before the near-dup
  # stage ever ran (fixed in common/db.py + scripts/run_pipeline.py), so recent
  # logs show no OOM only because the memory-hungry stage was being skipped.
  #
  # If runs start failing, check `fly logs --app german-smart-apply-workers` for
  # an out-of-memory kill, or for a run that logs [dedup] but never [near-dedup].
  # The durable fix is to bound the query - process one (company, location)
  # bucket at a time instead of the whole country - not to keep raising this
  # number.
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
